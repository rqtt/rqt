[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rqt-monitor"
dynamic = ["version"]
description = "r<q>t: a terminal-flavoured desktop hardware monitor"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "teo" }]
keywords = ["hardware monitor", "system monitor", "cpu", "gpu", "temperature", "pyside6"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Environment :: X11 Applications :: Qt",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "PySide6>=6.6",
    "pyqtgraph>=0.13.4",
    "numpy>=1.24",
    "psutil>=5.9",
    "nvidia-ml-py>=12.535",
    "pywin32>=306; sys_platform == 'win32'",
    "WMI>=1.5.1; sys_platform == 'win32'",
]

[project.gui-scripts]
rqt = "rqt.app:main"

[tool.setuptools]
packages = ["rqt", "rqt.ui"]

[tool.setuptools.dynamic]
version = { attr = "rqt.__version__" }
